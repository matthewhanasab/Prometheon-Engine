# Keeps the site's caches warm so the first visitor to a popular ticker gets
# the fast path (see scripts/warm-cache.mjs for why). Runs every half hour
# through the US trading day, hourly outside it, and can be fired by hand
# after a deploy.
name: Warm caches

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"   # every 30 min, 13:00–21:30 UTC, weekdays (US session)
    - cron: "15 0-12,22,23 * * *"  # hourly otherwise
  workflow_dispatch:
    inputs:
      quick:
        description: "Defaults only"
        type: boolean
        default: false

concurrency:
  group: warm-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/warm-cache.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/warm-cache.mjs ${{ inputs.quick && '--quick' || '' }}
